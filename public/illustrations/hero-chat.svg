<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="#0b1120"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="chat-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e4d3b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- WhatsApp-style chat bubbles -->
  <!-- Incoming message -->
  <g transform="translate(40, 60)">
    <rect width="180" height="45" rx="12" fill="#1b2537"/>
    <rect x="12" y="12" width="120" height="8" rx="4" fill="#334155"/>
    <rect x="12" y="25" width="80" height="8" rx="4" fill="#334155"/>
    <text x="12" y="38" font-family="Inter, sans-serif" font-size="9" fill="#64748b">23:41</text>
  </g>
  
  <!-- Bot reply -->
  <g transform="translate(180, 120)">
    <rect width="190" height="55" rx="12" fill="#25d366"/>
    <rect x="12" y="10" width="140" height="8" rx="4" fill="#15803d"/>
    <rect x="12" y="23" width="100" height="8" rx="4" fill="#15803d"/>
    <rect x="12" y="36" width="60" height="8" rx="4" fill="#15803d"/>
    <text x="12" y="50" font-family="Inter, sans-serif" font-size="8" fill="#bbf7d0">Auto reply</text>
  </g>
  
  <!-- Incoming message 2 -->
  <g transform="translate(60, 195)">
    <rect width="160" height="40" rx="12" fill="#1b2537"/>
    <rect x="12" y="10" width="100" height="8" rx="4" fill="#334155"/>
    <rect x="12" y="23" width="70" height="8" rx="4" fill="#334155"/>
  </g>
  
  <!-- Bot reply 2 -->
  <g transform="translate(200, 250)">
    <rect width="170" height="35" rx="12" fill="#25d366"/>
    <rect x="12" y="10" width="120" height="8" rx="4" fill="#15803d"/>
    <rect x="12" y="23" width="80" height="8" rx="4" fill="#15803d"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="40" fill="url(#green-glow)" opacity="0.5"/>
  <circle cx="350" cy="250" r="60" fill="url(#green-glow)" opacity="0.3"/>
  
  <!-- Connection lines -->
  <path d="M 220 85 Q 250 100 230 130" stroke="#34d399" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 370 145 Q 380 170 360 195" stroke="#34d399" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
