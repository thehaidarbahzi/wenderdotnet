<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="orb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#25d366" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  
  <!-- Glowing orb -->
  <circle cx="50" cy="50" r="40" fill="url(#orb-grad)" filter="url(#orb-blur)"/>
  <circle cx="50" cy="50" r="20" fill="#25d366" opacity="0.3"/>
  <circle cx="50" cy="50" r="8" fill="#34d399" opacity="0.5"/>
</svg>
