<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="chat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2537"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
  </defs>
  
  <!-- Chat container -->
  <rect width="300" height="200" rx="12" fill="url(#chat-bg)"/>
  
  <!-- Header -->
  <rect width="300" height="35" rx="12" fill="#101828"/>
  <rect y="35" width="300" height="1" fill="#2a3648"/>
  <circle cx="25" cy="17" r="10" fill="#25d366"/>
  <text x="25" y="21" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Pelanggan</text>
  <rect x="45" y="12" width="60" height="6" rx="3" fill="#334155"/>
  <rect x="45" y="21" width="40" height="4" rx="2" fill="#475569"/>
  
  <!-- Incoming message -->
  <g transform="translate(15, 50)">
    <rect width="160" height="50" rx="10" fill="#1e293b"/>
    <rect x="10" y="10" width="120" height="7" rx="3" fill="#334155"/>
    <rect x="10" y="22" width="90" height="7" rx="3" fill="#334155"/>
    <rect x="10" y="34" width="70" height="6" rx="3" fill="#475569"/>
    <text x="10" y="46" font-family="Inter, sans-serif" font-size="7" fill="#64748b">23:41</text>
  </g>
  
  <!-- Auto reply indicator -->
  <g transform="translate(180, 65)">
    <rect width="110" height="24" rx="12" fill="#25d366" opacity="0.2"/>
    <circle cx="15" cy="12" r="5" fill="#25d366"/>
    <text x="15" y="15" font-family="Inter, sans-serif" font-size="6" fill="white" text-anchor="middle">W</text>
    <text x="28" y="15" font-family="Inter, sans-serif" font-size="8" fill="#34d399">Auto reply</text>
  </g>
  
  <!-- Bot reply -->
  <g transform="translate(125, 100)">
    <rect width="160" height="55" rx="10" fill="#25d366"/>
    <rect x="10" y="10" width="120" height="7" rx="3" fill="#15803d"/>
    <rect x="10" y="22" width="100" height="7" rx="3" fill="#15803d"/>
    <rect x="10" y="34" width="80" height="6" rx="3" fill="#15803d"/>
    <text x="10" y="48" font-family="Inter, sans-serif" font-size="7" fill="#bbf7d0">Dikirim otomatis</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="280" cy="30" r="20" fill="#25d366" opacity="0.1"/>
  <circle cx="20" cy="180" r="15" fill="#34d399" opacity="0.1"/>
</svg>
