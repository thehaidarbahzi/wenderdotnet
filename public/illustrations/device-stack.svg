<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="device-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4d3b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="150" cy="150" r="120" fill="#25d366" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Phone outline -->
  <rect x="90" y="30" width="120" height="240" rx="16" stroke="#34d399" stroke-width="2" fill="url(#device-grad)"/>
  
  <!-- Screen content -->
  <rect x="100" y="50" width="100" height="180" rx="8" fill="#1b2537"/>
  
  <!-- Status bar -->
  <rect x="100" y="50" width="100" height="20" fill="#101828"/>
  <circle cx="115" cy="60" r="4" fill="#25d366"/>
  <rect x="160" y="57" width="25" height="6" rx="3" fill="#334155"/>
  
  <!-- Chat list -->
  <g transform="translate(100, 80)">
    <!-- Chat 1 -->
    <rect width="100" height="35" fill="#1b2537"/>
    <circle cx="17" cy="17" r="10" fill="#25d366"/>
    <text x="17" y="21" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">W</text>
    <rect x="32" y="10" width="50" height="6" rx="3" fill="#334155"/>
    <rect x="32" y="20" width="35" height="5" rx="2" fill="#475569"/>
    <text x="85" y="15" font-family="Inter, sans-serif" font-size="6" fill="#64748b">23:41</text>
    
    <!-- Chat 2 -->
    <g transform="translate(0, 35)">
      <rect width="100" height="35" fill="#1b2537"/>
      <circle cx="17" cy="17" r="10" fill="#34d399"/>
      <text x="17" y="21" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">CS</text>
      <rect x="32" y="10" width="45" height="6" rx="3" fill="#334155"/>
      <rect x="32" y="20" width="55" height="5" rx="2" fill="#25d366"/>
    </g>
    
    <!-- Chat 3 -->
    <g transform="translate(0, 70)">
      <rect width="100" height="35" fill="#1b2537"/>
      <circle cx="17" cy="17" r="10" fill="#fbbf24"/>
      <text x="17" y="21" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">TG</text>
      <rect x="32" y="10" width="55" height="6" rx="3" fill="#334155"/>
      <rect x="32" y="20" width="40" height="5" rx="2" fill="#475569"/>
    </g>
  </g>
  
  <!-- Floating elements -->
  <g transform="translate(30, 100)" filter="url(#glow)">
    <rect width="80" height="40" rx="8" fill="#101828" stroke="#25d366" stroke-width="1"/>
    <circle cx="20" cy="20" r="8" fill="#25d366"/>
    <text x="20" y="23" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">QR</text>
    <rect x="35" y="12" width="35" height="5" rx="2" fill="#334155"/>
    <rect x="35" y="20" width="25" height="4" rx="2" fill="#475569"/>
  </g>
  
  <g transform="translate(190, 180)" filter="url(#glow)">
    <rect width="90" height="45" rx="8" fill="#101828" stroke="#34d399" stroke-width="1"/>
    <rect x="10" y="10" width="70" height="6" rx="3" fill="#334155"/>
    <rect x="10" y="20" width="50" height="5" rx="2" fill="#475569"/>
    <rect x="10" y="30" width="60" height="5" rx="2" fill="#25d366"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="50" cy="50" r="3" fill="#34d399" opacity="0.5"/>
  <circle cx="250" cy="80" r="4" fill="#25d366" opacity="0.4"/>
  <circle cx="60" cy="250" r="3" fill="#34d399" opacity="0.3"/>
  <circle cx="240" cy="220" r="5" fill="#25d366" opacity="0.3"/>
</svg>
