<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" fill="none">
  <defs>
    <linearGradient id="log-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2537"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
  </defs>
  
  <!-- Log container -->
  <rect width="300" height="250" rx="12" fill="url(#log-bg)"/>
  
  <!-- Header -->
  <rect width="300" height="35" rx="12" fill="#101828"/>
  <rect y="35" width="300" height="1" fill="#2a3648"/>
  <rect x="15" y="12" width="60" height="6" rx="3" fill="#334155"/>
  
  <!-- Timeline line -->
  <rect x="24" y="45" width="2" height="195" fill="#2a3648"/>
  
  <!-- Log entries -->
  <g transform="translate(15, 50)">
    <!-- Entry 1 -->
    <circle cx="12" cy="8" r="5" fill="#25d366"/>
    <rect x="30" y="0" width="100" height="30" rx="6" fill="#1e293b"/>
    <rect x="40" y="6" width="50" height="5" rx="2" fill="#25d366"/>
    <rect x="40" y="15" width="80" height="5" rx="2" fill="#334155"/>
    <text x="240" y="10" font-family="Inter, sans-serif" font-size="7" fill="#64748b">23:41</text>
    
    <!-- Entry 2 -->
    <g transform="translate(0, 40)">
      <circle cx="12" cy="8" r="5" fill="#34d399"/>
      <rect x="30" y="0" width="120" height="30" rx="6" fill="#1e293b"/>
      <rect x="40" y="6" width="60" height="5" rx="2" fill="#34d399"/>
      <rect x="40" y="15" width="90" height="5" rx="2" fill="#334155"/>
      <text x="240" y="10" font-family="Inter, sans-serif" font-size="7" fill="#64748b">23:41</text>
    </g>
    
    <!-- Entry 3 -->
    <g transform="translate(0, 80)">
      <circle cx="12" cy="8" r="5" fill="#fbbf24"/>
      <rect x="30" y="0" width="110" height="30" rx="6" fill="#1e293b"/>
      <rect x="40" y="6" width="55" height="5" rx="2" fill="#fbbf24"/>
      <rect x="40" y="15" width="85" height="5" rx="2" fill="#334155"/>
      <text x="240" y="10" font-family="Inter, sans-serif" font-size="7" fill="#64748b">23:42</text>
    </g>
    
    <!-- Entry 4 -->
    <g transform="translate(0, 120)">
      <circle cx="12" cy="8" r="5" fill="#f87171"/>
      <rect x="30" y="0" width="130" height="30" rx="6" fill="#1e293b"/>
      <rect x="40" y="6" width="65" height="5" rx="2" fill="#f87171"/>
      <rect x="40" y="15" width="95" height="5" rx="2" fill="#334155"/>
      <text x="240" y="10" font-family="Inter, sans-serif" font-size="7" fill="#64748b">23:42</text>
    </g>
  </g>
</svg>
